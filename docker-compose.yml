services:

  ms_main_load_data:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ms_main_load_data
    restart: unless-stopped
    volumes:
      - ./app:/app
      # - ./app/ms_main_load_data/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./app/static:/app/staticfiles
    ports:
      - "8005:8000"
    env_file:
      - ./app/.env
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    driver: bridge